<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CleanConnect — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #fbfdfc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #061b15;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(180deg, #14b391, #0a715f);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .icon svg { width: 30px; height: 30px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: rgba(6, 27, 21, 0.6); max-width: 320px; margin: 0 0 20px; }
      button {
        border: none;
        background: #14b391;
        color: white;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 22px;
        border-radius: 999px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9 17.5L20 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>CleanConnect needs a connection to show your building&rsquo;s service records. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
